name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint, types, and tests
        run: npm run check
      - name: Validate Expo dependencies and configuration
        run: npx expo-doctor
      - name: Verify the web-ready route bundle
        run: npx expo export --platform web --output-dir dist
